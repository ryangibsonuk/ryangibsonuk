services:
  - type: web
    name: gibson-hq
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: hq-data
      mountPath: /var/lib/hq
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: HQ_DATA_DIR
        value: /var/lib/hq
      - key: DASHBOARD_PIN
        sync: false
      - key: CONTROL_CENTRE_API_KEY
        sync: false
      - key: CHATGPT_APP_URL
        sync: false
      - key: CHATGPT_APP_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4-1-fast
      - key: INGEST_SECRET
        sync: false
      - key: GITHUB_USERNAME
        value: ryangibsonuk
