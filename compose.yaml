services:
  hq:
    build: .
    image: gibson-hq:local
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DASHBOARD_PIN: ${DASHBOARD_PIN:-}
      CONTROL_CENTRE_API_KEY: ${CONTROL_CENTRE_API_KEY:-}
      CHATGPT_APP_URL: ${CHATGPT_APP_URL:-}
      CHATGPT_APP_KEY: ${CHATGPT_APP_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-4-1-fast}
      INGEST_SECRET: ${INGEST_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-ryangibsonuk}
      GOOGLE_SCRIPT_URL: ${GOOGLE_SCRIPT_URL:-}
      GOOGLE_SCRIPT_TOKEN: ${GOOGLE_SCRIPT_TOKEN:-}
      HQ_DATA_DIR: /var/lib/hq
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - hq-data:/var/lib/hq
    restart: unless-stopped

volumes:
  hq-data:
